[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned by version, never by path. The verifier resolves it from its own solc cache.
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

# Fully offline: no remote deps, no ffi, no filesystem access.
offline = true
ffi = false
fs_permissions = []

[fuzz]
runs = 512
max_test_rejects = 65536

[invariant]
runs = 64
depth = 128
fail_on_revert = true

[fmt]
line_length = 120

[lint]
lint_on_build = false
